<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NANDalogic</title>
<meta name="description" content="Personal projects by Josh Nanda.">
<style>
  :root {
    --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73;
    --card: #f5f5f7; --card-hover: #ebebef; --border: #e2e2e7; --accent: #0a66d8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113; --fg: #f2f2f4; --muted: #a1a1a6;
      --card: #1c1c1f; --card-hover: #26262a; --border: #2e2e33; --accent: #5aa2ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  h2 { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 32px 0 10px; }
  p.muted { color: var(--muted); margin: 0 0 8px; }

  .links { display: grid; gap: 10px; }
  a.card {
    display: flex; align-items: center; gap: 14px;
    padding: 16px; min-height: 64px;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    color: var(--fg); text-decoration: none;
    transition: background .15s;
  }
  a.card:hover { background: var(--card-hover); }
  a.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card .text { flex: 1; min-width: 0; }
  .card .name { font-weight: 600; display: block; }
  .card .desc { color: var(--muted); font-size: 15px; display: block; }
  .card svg { flex: none; width: 20px; height: 20px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .card .lock { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .card .lock svg { width: 13px; height: 13px; }

  footer { margin-top: 40px; color: var(--muted); font-size: 15px; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>NANDalogic</h1>
  <p class="muted">Personal projects by Josh Nanda.</p>

  <h2>Open to everyone</h2>
  <div class="links">
    <a class="card" href="https://learn.nandalogic.com">
      <span class="text">
        <span class="name">Learn</span>
        <span class="desc">Interactive, sourced explainers</span>
      </span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
  </div>

  <h2>Private</h2>
  <div class="links">
    <a class="card" href="https://bets.nandalogic.com">
      <span class="text">
        <span class="name">Bets</span>
        <span class="lock"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Sign-in required</span>
      </span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
    <a class="card" href="https://www.notion.so/857d577499d04b539d3224c7d8d2872e">
      <span class="text">
        <span class="name">Planner</span>
        <span class="lock"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Sign-in required</span>
      </span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
  </div>

  <footer>
    <p>Contact: <a href="mailto:nanda.joshjm@gmail.com">nanda.joshjm@gmail.com</a></p>
  </footer>
</main>
</body>
</html>
